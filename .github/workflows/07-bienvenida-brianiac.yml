      # - name: 📧 Notificar a la Fortaleza por correo
      #   uses: dawidd6/action-send-mail@v4
      #   with:
      #     # Credenciales SMTP guardadas como secrets del repositorio
      #     server_address: ${{ secrets.SMTP_SERVER }}
      #     server_port: ${{ secrets.SMTP_PORT }}
