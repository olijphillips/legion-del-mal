name: 📣Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Thanos
          - Green Goblin

      mensaje:
        description: "Contenido del mensaje"
        required: true
        default: "La misión fué un éxito"

      cow_say:
        description: "El estilo de cowsay"
        required: true
        type: choice
        options:
          - stegosaurus
          - tux
          - dragon
          - elefant

      prioridad:
        description: "Nivel de Prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "======================================="
          echo "Transmisión interceptada...            "
          echo "======================================="
          echo ""
          echo "---------------------------------------"
          echo "De Villano: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "------Mensaje------"
          echo ""
          cowsay -f "${{ inputs.cow_say }}" "${{ inputs.mensaje }}"  
          echo ""
          echo "---------------------------------------"
          echo ""
          echo "Otros mensajes:"
          echo ""              
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
          echo "---------------------------------------"
