name: 📣Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Thanos
          - Green Goblin
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
